<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Single Record | Zunera's DMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="brand"><div class="brand-mark">✦</div>
        <span>Zunera's Digital<br>Document Management System</span>
    </div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="insert.html">Insert</a>
        <a href="update.html">Update</a>
        <a href="delete.html">Delete</a>
        <a href="list.html">List</a>
        <a class="active" href="listOne.html">Search</a>
    </div>
</nav>

<main class="container">
    <section class="card">
        <div class="list-header">
            <img src="images/listOne.jpg" class="page-image" alt="View one record">
            <div>
                <h2>⌕ View Single Record</h2>
                <p class="subtitle">Find and view the complete details of one selected database record.</p>
            </div>
        </div>

        <div class="field">
            <label for="tableSelect">Select Table</label>
            <select id="tableSelect">
                <option value="">-- Select Table --</option>
                <option value="users">Users</option>
                <option value="categories">Categories</option>
                <option value="documents">Documents</option>
                <option value="document_access">Document Access</option>
            </select>
        </div>

        <div class="field">
            <label for="recordSelect">Select Record</label>
            <select id="recordSelect" disabled>
                <option value="">-- Select Record --</option>
            </select>
        </div>

        <button type="button" class="btn btn-primary" id="getButton">⌕ Get Details</button>

        <div id="message" class="message"></div>

        <div id="recordDetails" class="record-details" style="display:none;"></div>
    </section>
</main>

<footer class="footer">© 2026 Zunera's Digital Document Management System</footer>

<script>
const API_BASE = "http://localhost:3000";

const config = {
    users: {
        id: "user_id",
        label: r => r.user_id + " - " + r.name
    },
    categories: {
        id: "category_id",
        label: r => r.category_id + " - " + r.category_name
    },
    documents: {
        id: "document_id",
        label: r => r.document_id + " - " + r.title
    },
    document_access: {
        id: "access_id",
        label: r => r.access_id + " - Document " + r.document_id
    }
};

const tableSelect = document.getElementById("tableSelect");
const recordSelect = document.getElementById("recordSelect");
const details = document.getElementById("recordDetails");

function showMessage(text, type) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = "message show " + type;
}

tableSelect.addEventListener("change", async () => {
    recordSelect.innerHTML = '<option value="">-- Select Record --</option>';
    recordSelect.disabled = true;
    details.style.display = "none";

    const table = tableSelect.value;
    if (!table) return;

    try {
        const response = await fetch(`${API_BASE}/${table}`);
        if (!response.ok) throw new Error("Unable to load records.");

        const records = await response.json();

        records.forEach(record => {
            const option = document.createElement("option");
            option.value = record[config[table].id];
            option.textContent = config[table].label(record);
            recordSelect.appendChild(option);
        });

        recordSelect.disabled = false;

        if (records.length === 0) {
            showMessage("No records are available in this table.", "error");
        }
    } catch (error) {
        showMessage(error.message, "error");
    }
});

document.getElementById("getButton").addEventListener("click", async () => {
    const table = tableSelect.value;
    const id = recordSelect.value;

    if (!table || !id) {
        showMessage("Please select a table and a record.", "error");
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/${table}/${id}`);
        if (!response.ok) throw new Error("Unable to retrieve the selected record.");

        const result = await response.json();
        const record = Array.isArray(result) ? result[0] : result;

        if (!record) throw new Error("Record not found.");

        details.innerHTML = "";

        Object.entries(record).forEach(([key, value]) => {
            const row = document.createElement("p");
            const strong = document.createElement("strong");
            strong.textContent = key.replaceAll("_", " ").toUpperCase() + ": ";

            row.appendChild(strong);
            row.appendChild(document.createTextNode(
                value === null || value === "" ? "—" : String(value)
            ));

            details.appendChild(row);
        });

        details.style.display = "block";
        showMessage("Record details loaded successfully.", "success");
    } catch (error) {
        details.style.display = "none";
        showMessage(error.message, "error");
    }
});
</script>

</body>
</html>
